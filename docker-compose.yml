services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DOCUPILOT_ENV: docker
      DOCUPILOT_LOG_LEVEL: INFO
      DOCUPILOT_API_HOST: 0.0.0.0
      DOCUPILOT_API_PORT: 8000
      DOCUPILOT_REDIS_URL: redis://redis:6379/0
      DOCUPILOT_REPOSITORY_BACKEND: postgres
      DOCUPILOT_POSTGRES_URL: postgresql+psycopg://docupilot:docupilot@postgres:5432/docupilot
      DOCUPILOT_OBJECT_STORE_ROOT: /data/object-store
      DOCUPILOT_AUTH_SECRET: ${DOCUPILOT_AUTH_SECRET:-docupilot-change-me}
      DOCUPILOT_SESSION_TTL_SECONDS: ${DOCUPILOT_SESSION_TTL_SECONDS:-43200}
      DOCUPILOT_SESSION_COOKIE_SECURE: ${DOCUPILOT_SESSION_COOKIE_SECURE:-false}
      DOCUPILOT_DISABLE_SIGNUP: ${DOCUPILOT_DISABLE_SIGNUP:-false}
      DOCUPILOT_LLM_REQUEST_TIMEOUT_SECONDS: ${DOCUPILOT_LLM_REQUEST_TIMEOUT_SECONDS:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8080:8000"
    volumes:
      - docupilot_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sh", "-c", "exec celery -A docupilot.workers.celery_app.celery_app worker --loglevel=INFO ${DOCUPILOT_WORKER_CONCURRENCY:+--concurrency=${DOCUPILOT_WORKER_CONCURRENCY}}"]
    environment:
      DOCUPILOT_ENV: docker
      DOCUPILOT_LOG_LEVEL: INFO
      DOCUPILOT_REDIS_URL: redis://redis:6379/0
      DOCUPILOT_REPOSITORY_BACKEND: postgres
      DOCUPILOT_POSTGRES_URL: postgresql+psycopg://docupilot:docupilot@postgres:5432/docupilot
      DOCUPILOT_OBJECT_STORE_ROOT: /data/object-store
      DOCUPILOT_AUTH_SECRET: ${DOCUPILOT_AUTH_SECRET:-docupilot-change-me}
      DOCUPILOT_SESSION_TTL_SECONDS: ${DOCUPILOT_SESSION_TTL_SECONDS:-43200}
      DOCUPILOT_SESSION_COOKIE_SECURE: ${DOCUPILOT_SESSION_COOKIE_SECURE:-false}
      DOCUPILOT_DISABLE_SIGNUP: ${DOCUPILOT_DISABLE_SIGNUP:-false}
      DOCUPILOT_LLM_REQUEST_TIMEOUT_SECONDS: ${DOCUPILOT_LLM_REQUEST_TIMEOUT_SECONDS:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - docupilot_data:/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: docupilot
      POSTGRES_PASSWORD: docupilot
      POSTGRES_DB: docupilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docupilot -d docupilot"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  docupilot_data:
  postgres_data:
